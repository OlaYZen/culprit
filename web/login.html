<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>sign in — culprit</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/theme.css">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg-primary); color: var(--text-normal, #ddd);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: min(340px, calc(100vw - 40px)); padding: 28px;
    background: var(--bg-secondary, var(--bg-primary));
    border: 1px solid var(--border, rgba(128,128,128,.25));
    border-radius: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand svg { width: 26px; height: 26px; stroke: var(--accent, #6af);
               fill: none; stroke-width: 1.8; }
  .brand span { font-size: 17px; font-weight: 650; letter-spacing: .02em; }
  label { display: block; font-size: 12px; font-weight: 550; margin: 12px 0 4px; }
  input {
    width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px;
    background: var(--bg-sunken, transparent); color: inherit;
    border: 1px solid var(--border, rgba(128,128,128,.35)); border-radius: 6px;
  }
  input:focus { outline: 2px solid var(--accent, #6af); outline-offset: -1px; }
  button {
    width: 100%; margin-top: 18px; padding: 10px; font-size: 14px;
    font-weight: 600; color: #fff; background: var(--accent, #3a7afe);
    border: 0; border-radius: 6px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--crit, #e5484d); font-size: 12.5px; margin-top: 10px;
           min-height: 1.2em; }
  .hint { color: var(--text-muted, #999); font-size: 11.5px; margin-top: 14px;
          line-height: 1.5; }
</style>
</head>
<body>
<form class="card" id="form">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2.5" y="4" width="19" height="13" rx="2"/>
      <path d="M8 20.5h8M12 17.5v3"/>
    </svg>
    <span>culprit</span>
  </div>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password"
         autocomplete="current-password" required>
  <button type="submit" id="go">Sign in</button>
  <div class="error" id="err"></div>
  <div class="hint">
    Accounts are managed on the host:
    <code>python&nbsp;-m&nbsp;culprit&nbsp;users&nbsp;add&nbsp;&lt;name&gt;</code>
  </div>
</form>
<script>
  // Respect a previously chosen theme; default matches the dashboard.
  try {
    const theme = localStorage.getItem("culprit-theme");
    if (theme) document.documentElement.dataset.theme = theme;
  } catch { /* private mode */ }

  const form = document.getElementById("form");
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    err.textContent = "";
    go.disabled = true;
    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: form.username.value.trim(),
          password: form.password.value,
        }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        err.textContent = payload.detail || `Sign-in failed (${response.status}).`;
        go.disabled = false;
        return;
      }
      window.location.href = "/";
    } catch (error) {
      err.textContent = `Could not reach the server: ${error.message}`;
      go.disabled = false;
    }
  });
</script>
</body>
</html>
