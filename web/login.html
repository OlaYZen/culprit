<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Sign in — Culprit</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css">
<style>
  body { overflow: auto; min-height: 100vh; display: grid; place-items: center; }
  .login { width: min(340px, calc(100vw - 40px)); }
  .login__brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .login__brand svg { width: 22px; height: 22px; color: var(--fg-1); }
  .login__brand span { font-size: 16px; font-weight: 600; color: var(--fg-1); }
  .login label { display: block; font-size: var(--fs-s); font-weight: 500; color: var(--fg-1); margin: 14px 0 5px; }
  .login input {
    width: 100%; height: 34px; padding: 0 10px; font-size: var(--fs);
    background: var(--bg-2); color: inherit;
    border: 1px solid var(--line-2); border-radius: var(--r);
  }
  .login input:focus { outline: none; border-color: var(--accent); }
  .login button {
    width: 100%; height: 34px; margin-top: 20px; font-size: var(--fs); font-weight: 600;
    color: var(--on-accent); background: var(--accent); border-radius: var(--r);
  }
  .login button:hover { background: var(--accent-1); }
  .login button:disabled { opacity: .6; cursor: wait; }
  .login__err { color: var(--crit); font-size: var(--fs-s); margin-top: 10px; min-height: 1.3em; }
  .login__or { display: none; align-items: center; gap: 10px; margin-top: 16px; color: var(--fg-3); font-size: var(--fs-xs); }
  .login__or::before, .login__or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .login__alt {
    display: none; box-sizing: border-box; width: 100%; height: 34px; margin-top: 12px; line-height: 32px;
    text-align: center; text-decoration: none; font-size: var(--fs); font-weight: 600;
    color: var(--fg-1); background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r);
  }
  .login__alt:hover { border-color: var(--accent); color: var(--accent); }
  .login--sso .login__or, .login--sso .login__alt { display: flex; }
  .login--sso .login__alt { display: block; }
  .login__hint { color: var(--fg-3); font-size: var(--fs-xs); margin-top: 18px; line-height: 1.55; padding-top: 14px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<form class="login" id="form">
  <div class="login__brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4" width="18" height="12" rx="1.5"/>
      <path d="M3 13h4l2.5-5 3 8 2.5-5H21M8 20h8"/>
    </svg>
    <span>Culprit</span>
  </div>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="go">Sign in</button>
  <div class="login__or">or</div>
  <a class="login__alt" id="sso" href="/api/auth/oidc/start" rel="nofollow">Continue with…</a>
  <div class="login__err" id="err" aria-live="polite"></div>
  <div class="login__hint">
    Accounts are managed on the host:
    <code>python&nbsp;-m&nbsp;culprit&nbsp;users&nbsp;add&nbsp;&lt;name&gt;</code>
  </div>
</form>
<script>
  try {
    const theme = localStorage.getItem("culprit-theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch { /* private mode */ }

  const form = document.getElementById("form");
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  const sso = document.getElementById("sso");

  // A sign-in provider (Settings > SSO) shows up as a second way in. The
  // link is a plain navigation: the round-trip leaves this page for the
  // provider and comes back through the server, never through script.
  fetch("/api/auth").then((r) => r.json()).then((auth) => {
    const provider = (auth.providers || [])[0];
    if (!provider) return;
    sso.textContent = `Continue with ${provider.label}`;
    sso.href = provider.start;
    form.classList.add("login--sso");
  }).catch(() => { /* the password form is enough */ });

  // The provider round-trip reports failure as ?error=<code>: one of a fixed
  // set, never the provider's own text. Rendered once, then dropped from the
  // URL so a reload does not repeat it.
  const REASONS = {
    disabled: "Signing in with a provider is not set up on this host.",
    state: "That sign-in did not start here, or the browser dropped its state cookie. Try again.",
    expired: "That sign-in took longer than ten minutes. Try again.",
    denied: "The provider did not approve the sign-in.",
    rate_limited: "Too many sign-in attempts from your address — wait a few minutes.",
    discovery: "The provider could not be reached, or its configuration is not what this host expects.",
    exchange: "The provider refused to exchange the sign-in code.",
    id_token: "The provider's answer was not issued for this host.",
    nonce: "The provider's answer did not match this sign-in.",
    userinfo: "The provider would not confirm who signed in.",
    not_linked: "No account here is linked to that identity, and this host does not create accounts on first sign-in. Ask an admin to link your e-mail address.",
    domain: "That e-mail domain is not allowed to sign in here.",
    email_unverified: "The provider does not vouch for that e-mail address, so it cannot claim an account here.",
    linked_elsewhere: "That identity is already linked to another account.",
  };
  const params = new URLSearchParams(location.search);
  if (params.has("error")) {
    err.textContent = REASONS[params.get("error")] || "Signing in with the provider failed. Try again.";
    history.replaceState(null, "", location.pathname);
  }
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    err.textContent = "";
    go.disabled = true;   // only while the request is in flight
    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: form.username.value.trim(),
          password: form.password.value,
        }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        err.textContent = payload.detail || `Sign-in failed (${response.status}).`;
        go.disabled = false;
        return;
      }
      window.location.href = "/";
    } catch (error) {
      err.textContent = `Could not reach the server: ${error.message}`;
      go.disabled = false;
    }
  });
</script>
</body>
</html>
