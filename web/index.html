<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Culprit</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/shell.css">
<link rel="stylesheet" href="/assets/css/ui.css">
<link rel="stylesheet" href="/assets/css/mobile.css">
<script>
  // Apply the saved theme before first paint so there is no flash.
  try {
    const t = localStorage.getItem("culprit-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) { /* private mode */ }
</script>
</head>
<body>

<!-- ══ Top bar ═════════════════════════════════════════════════════════════ -->
<header class="topbar">
  <div class="topbar__brand">
    <svg class="topbar__mark" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4" width="18" height="12" rx="1.5"/>
      <path d="M3 13h4l2.5-5 3 8 2.5-5H21M8 20h8"/>
    </svg>
    <span class="topbar__name">Culprit</span>
  </div>

  <div class="topbar__node">
    <!-- Node picker: which machine every view describes. A native select,
         because it must work with a keyboard and cost nothing. -->
    <div class="nodepick" id="nodesel-wrap" hidden
         title="Which machine the dashboard shows. Agents report in on their own cadence.">
      <span class="nodepick__dot" data-bind="node-dot"></span>
      <select id="node-select" aria-label="Node"></select>
    </div>
    <span class="topbar__host" title="Hostname and time since boot">
      <b data-bind="hostname">—</b>
      <span class="faint">·</span>
      <span>up <span data-bind="uptime" class="num">—</span></span>
    </span>
    <span class="topbar__stale" data-bind="node-stale" hidden></span>
  </div>

  <!-- The one-glance verdict; opens the Lag Doctor. Stays in the bar on
       every screen size, unlike the session tools below. -->
  <div class="topbar__status">
    <button class="health" data-nav="doctor" title="Open Lag Doctor">
      <span class="health__dot" data-bind="health-dot"></span>
      <span data-bind="health-text">Starting…</span>
    </button>
  </div>

  <div class="topbar__tools">
    <!-- Segmented control, not a dropdown: four mutually exclusive options
         that benefit from being visible (uxgoodpatterns: visible options). -->
    <div class="seg" role="group" aria-label="Refresh interval"
         title="Sampling rate of the selected node, for this session only. Use Settings to save a host default.">
      <span class="seg__label">Refresh</span>
      <span class="seg__opts">
        <button class="seg__opt" data-interval="0.5">0.5s</button>
        <button class="seg__opt is-on" data-interval="1">1s</button>
        <button class="seg__opt" data-interval="2">2s</button>
        <button class="seg__opt" data-interval="5">5s</button>
      </span>
    </div>

    <!-- Toggle switch, not a checkbox: takes effect immediately, no submit. -->
    <label class="toggle" title="Pause pauses the display, not the sampler">
      <input type="checkbox" id="live-toggle" checked>
      <span class="toggle__track"><span class="toggle__knob"></span></span>
      <span>Live</span>
    </label>

    <span class="topbar__sep" aria-hidden="true"></span>

    <button class="iconbtn" id="theme-toggle" title="Switch theme"
            aria-label="Switch between dark and light theme">
      <svg class="iconbtn__dark" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      <svg class="iconbtn__light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
    </button>

    <button class="iconbtn" id="logout" hidden title="Sign out" aria-label="Sign out">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>
</header>

<!-- ══ Banners (system notifications: connection lost/restored) ══════════ -->
<div class="banners" id="banners" role="status" aria-live="polite"></div>

<div class="frame">

  <!-- ══ Sidebar tabs ═════════════════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <nav class="nav" aria-label="Sections">
      <div class="nav__group">
        <div class="nav__label">Monitor</div>
        <button class="nav__item is-active" data-nav="overview">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/></svg>
          <span>Overview</span>
        </button>
        <button class="nav__item" data-nav="doctor">
          <svg viewBox="0 0 24 24"><path d="M3 13h4l2.5-7 3.5 14 3-7h5"/></svg>
          <span>Lag Doctor</span>
          <span class="nav__badge" data-bind="badge-doctor" hidden></span>
        </button>
        <button class="nav__item" data-nav="processes">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span>Processes</span>
          <span class="nav__count" data-bind="badge-processes"></span>
        </button>
        <button class="nav__item" data-nav="services">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
          <span>Services</span>
          <span class="nav__badge" data-bind="badge-services" hidden></span>
        </button>
      </div>

      <div class="nav__group">
        <div class="nav__label">Resources</div>
        <button class="nav__item" data-nav="storage">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
          <span>Storage</span>
          <span class="nav__badge" data-bind="badge-storage" hidden></span>
        </button>
        <button class="nav__item" data-nav="network">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>
          <span>Network</span>
        </button>
        <button class="nav__item" data-nav="ports">
          <svg viewBox="0 0 24 24"><path d="M9 2v5M15 2v5"/><rect x="6" y="7" width="12" height="8" rx="2"/><path d="M12 15v7"/></svg>
          <span>Ports</span>
          <span class="nav__count" data-bind="badge-ports"></span>
        </button>
        <button class="nav__item" data-nav="sync">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.4"/><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.6"/><path d="M20 4v4.6h-4.6M4 20v-4.6h4.6"/></svg>
          <span>Sync</span>
          <span class="nav__badge" data-bind="badge-sync" hidden></span>
        </button>
      </div>

      <div class="nav__group">
        <div class="nav__label">History</div>
        <button class="nav__item" data-nav="events">
          <svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><path d="M10.3 3.6L2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/></svg>
          <span>Events</span>
          <span class="nav__badge" data-bind="badge-events" hidden></span>
        </button>
        <button class="nav__item" data-nav="sessions">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 21c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg>
          <span>Sessions</span>
        </button>
        <button class="nav__item" data-nav="trends">
          <svg viewBox="0 0 24 24"><path d="M3 20V4M3 20h18"/><path d="M6.5 16l4-5 3.5 3 4.5-7"/></svg>
          <span>Trends</span>
        </button>
      </div>

      <div class="nav__group nav__group--end">
        <button class="nav__item" data-nav="nodes">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="2.5" y="16" width="6" height="5" rx="1"/><rect x="15.5" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M5.5 16v-2a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v2"/></svg>
          <span>Nodes</span>
          <span class="nav__badge" data-bind="badge-nodes" hidden></span>
        </button>
        <button class="nav__item" data-nav="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 2.6 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.7-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 2.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.7l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21.4 11a2 2 0 1 1 0 4z"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </nav>

    <!-- Compact always-visible vitals, so switching views never loses sight
         of the machine's state. -->
    <div class="sidebar__vitals" id="sidebar-vitals">
      <div class="vital" data-key="cpu">
        <span class="vital__name">CPU</span>
        <span class="vital__bar"><i data-bind="mini-cpu-bar"></i></span>
        <span class="vital__val" data-bind="mini-cpu">—</span>
      </div>
      <div class="vital" data-key="mem">
        <span class="vital__name">RAM</span>
        <span class="vital__bar"><i data-bind="mini-mem-bar"></i></span>
        <span class="vital__val" data-bind="mini-mem">—</span>
      </div>
      <div class="vital" data-key="gpu">
        <span class="vital__name">GPU</span>
        <span class="vital__bar"><i data-bind="mini-gpu-bar"></i></span>
        <span class="vital__val" data-bind="mini-gpu">—</span>
      </div>
      <div class="vital" data-key="disk">
        <span class="vital__name">Disk</span>
        <span class="vital__bar"><i data-bind="mini-disk-bar"></i></span>
        <span class="vital__val" data-bind="mini-disk">—</span>
      </div>
      <div class="sidebar__cost" data-bind="overhead" title="What this tool costs to run"></div>
    </div>
  </aside>

  <!-- ══ Main ═════════════════════════════════════════════════════════════ -->
  <main class="main" id="main">
    <!-- Boot skeleton: the shape of the Overview, painted before the script
         loads so the first frame is never an empty pane. app.js clears it the
         moment the first view mounts; from then on each view carries its own
         skeletons until its data lands. -->
    <div class="views" id="views">
      <div class="view" id="boot-skeleton" aria-hidden="true">
        <div class="view__head">
          <div class="view__titles">
            <div class="sk" style="width:120px;height:17px"></div>
            <div class="sk" style="width:56%;height:10px;margin-top:9px"></div>
          </div>
        </div>
        <div class="stack">
          <div class="sec">
            <div class="sec__head"><div class="sec__title">Fleet</div></div>
            <div class="fleet"><div class="node"><div class="node__head"><div class="sk" style="height:14px;width:44%"></div><div class="sk" style="height:18px;width:54px;border-radius:3px"></div></div><div class="node__row"><div class="sk" style="height:14px;width:26px"></div><div class="sk" style="height:2px"></div><div class="sk" style="height:14px;width:34px;margin-left:auto"></div></div><div class="node__row"><div class="sk" style="height:14px;width:26px"></div><div class="sk" style="height:2px"></div><div class="sk" style="height:14px;width:34px;margin-left:auto"></div></div><div class="node__row"><div class="sk" style="height:14px;width:26px"></div><div class="sk" style="height:2px"></div><div class="sk" style="height:14px;width:34px;margin-left:auto"></div></div><div class="sk" style="height:11px;width:72%;margin-top:8px"></div></div><div class="node"><div class="node__head"><div class="sk" style="height:14px;width:44%"></div><div class="sk" style="height:18px;width:54px;border-radius:3px"></div></div><div class="node__row"><div class="sk" style="height:14px;width:26px"></div><div class="sk" style="height:2px"></div><div class="sk" style="height:14px;width:34px;margin-left:auto"></div></div><div class="node__row"><div class="sk" style="height:14px;width:26px"></div><div class="sk" style="height:2px"></div><div class="sk" style="height:14px;width:34px;margin-left:auto"></div></div><div class="node__row"><div class="sk" style="height:14px;width:26px"></div><div class="sk" style="height:2px"></div><div class="sk" style="height:14px;width:34px;margin-left:auto"></div></div><div class="sk" style="height:11px;width:72%;margin-top:8px"></div></div><div class="node"><div class="node__head"><div class="sk" style="height:14px;width:44%"></div><div class="sk" style="height:18px;width:54px;border-radius:3px"></div></div><div class="node__row"><div class="sk" style="height:14px;width:26px"></div><div class="sk" style="height:2px"></div><div class="sk" style="height:14px;width:34px;margin-left:auto"></div></div><div class="node__row"><div class="sk" style="height:14px;width:26px"></div><div class="sk" style="height:2px"></div><div class="sk" style="height:14px;width:34px;margin-left:auto"></div></div><div class="node__row"><div class="sk" style="height:14px;width:26px"></div><div class="sk" style="height:2px"></div><div class="sk" style="height:14px;width:34px;margin-left:auto"></div></div><div class="sk" style="height:11px;width:72%;margin-top:8px"></div></div></div>
          </div>
          <div class="status">
            <div class="status__text"><div class="sk" style="width:140px;height:16px"></div><div class="sk" style="width:60%;height:10px;margin-top:8px"></div></div>
            <div class="status__gauges"><div class="gauge"><div class="sk" style="width:42px;height:42px;border-radius:50%;margin:0 auto"></div></div><div class="gauge"><div class="sk" style="width:42px;height:42px;border-radius:50%;margin:0 auto"></div></div><div class="gauge"><div class="sk" style="width:42px;height:42px;border-radius:50%;margin:0 auto"></div></div><div class="gauge"><div class="sk" style="width:42px;height:42px;border-radius:50%;margin:0 auto"></div></div></div>
          </div>
          <div class="cells cells--metrics"><div style="padding:12px 14px"><div class="sk" style="height:10px;width:34%"></div><div class="sk" style="height:22px;width:80px;margin:8px 0 10px"></div><div class="sk" style="height:54px"></div></div><div style="padding:12px 14px"><div class="sk" style="height:10px;width:34%"></div><div class="sk" style="height:22px;width:80px;margin:8px 0 10px"></div><div class="sk" style="height:54px"></div></div><div style="padding:12px 14px"><div class="sk" style="height:10px;width:34%"></div><div class="sk" style="height:22px;width:80px;margin:8px 0 10px"></div><div class="sk" style="height:54px"></div></div><div style="padding:12px 14px"><div class="sk" style="height:10px;width:34%"></div><div class="sk" style="height:22px;width:80px;margin:8px 0 10px"></div><div class="sk" style="height:54px"></div></div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ══ Dialog host ═══════════════════════════════════════════════════════ -->
<div class="dialog-backdrop" id="modal-backdrop" hidden>
  <div class="dialog" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="dialog__head">
      <h2 class="dialog__title" id="modal-title"></h2>
      <button class="iconbtn dialog__close" id="modal-close" aria-label="Close" title="Close (Esc)">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="dialog__body" id="modal-body"></div>
    <footer class="dialog__foot" id="modal-foot" hidden></footer>
  </div>
</div>

<!-- Floating scroll-to-top, shown past 400px on long views. -->
<button class="totop" id="scrolltop" hidden aria-label="Scroll to top" title="Back to top">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
</button>

<!-- ══ Mobile bottom navigation ══════════════════════════════════════════ -->
<nav class="botnav" aria-label="Primary">
  <button class="botnav__item" data-nav="overview">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/></svg>
    <span>Overview</span>
  </button>
  <button class="botnav__item" data-nav="doctor">
    <svg viewBox="0 0 24 24"><path d="M3 13h4l2.5-7 3.5 14 3-7h5"/></svg>
    <span>Doctor</span>
    <span class="botnav__dot" data-bind="botnav-doctor-dot"></span>
  </button>
  <button class="botnav__item" data-nav="processes">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <span>Processes</span>
  </button>
  <button class="botnav__item" data-nav="ports">
    <svg viewBox="0 0 24 24"><path d="M9 2v5M15 2v5"/><rect x="6" y="7" width="12" height="8" rx="2"/><path d="M12 15v7"/></svg>
    <span>Ports</span>
  </button>
  <button class="botnav__item" id="botnav-more" type="button" aria-haspopup="dialog" aria-controls="msheet">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
    <span>More</span>
    <span class="botnav__dot" data-bind="botnav-more-dot"></span>
  </button>
</nav>

<!-- ══ Mobile "More" sheet ═══════════════════════════════════════════════ -->
<div class="sheet" id="msheet" role="dialog" aria-modal="true" aria-label="More">
  <div class="sheet__backdrop" data-msheet-close></div>
  <div class="sheet__panel">
    <div class="sheet__grab" data-msheet-close></div>
    <div class="sheet__label">Views</div>
    <div class="sheet__views">
      <button class="sheet__view" data-nav="services">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        <span>Services</span>
        <span class="nav__badge" data-bind="badge-services-m" hidden></span>
      </button>
      <button class="sheet__view" data-nav="storage">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        <span>Storage</span>
      </button>
      <button class="sheet__view" data-nav="network">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>
        <span>Network</span>
      </button>
      <button class="sheet__view" data-nav="sync">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.4"/><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.6"/><path d="M20 4v4.6h-4.6M4 20v-4.6h4.6"/></svg>
        <span>Sync</span>
      </button>
      <button class="sheet__view" data-nav="events">
        <svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><path d="M10.3 3.6L2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/></svg>
        <span>Events</span>
        <span class="nav__badge" data-bind="badge-events-m" hidden></span>
      </button>
      <button class="sheet__view" data-nav="sessions">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 21c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg>
        <span>Sessions</span>
      </button>
      <button class="sheet__view" data-nav="trends">
        <svg viewBox="0 0 24 24"><path d="M3 20V4M3 20h18"/><path d="M6.5 16l4-5 3.5 3 4.5-7"/></svg>
        <span>Trends</span>
      </button>
      <button class="sheet__view" data-nav="nodes">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="2.5" y="16" width="6" height="5" rx="1"/><rect x="15.5" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M5.5 16v-2a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v2"/></svg>
        <span>Nodes</span>
        <span class="nav__badge" data-bind="badge-nodes-m" hidden></span>
