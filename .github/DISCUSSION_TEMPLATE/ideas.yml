title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: |
        Float an idea or improvement here before it becomes a formal feature
        request. The best ideas keep Culprit lightweight and honest: they name a
        real problem and degrade gracefully when a source is missing.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation you are in and what makes it painful today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you imagine Culprit doing.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new or improved collector / metric
        - Lag Doctor scoring
        - Frontend / a view
        - Multi-node / fleet
        - Agent / deployment
        - Security / auth
        - Other
