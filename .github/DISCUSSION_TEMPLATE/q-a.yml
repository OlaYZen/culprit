title: "[Q&A]: "
body:
  - type: markdown
    attributes:
      value: |
        Ask the community how to do something with Culprit. For a suspected bug,
        open an issue instead; for a security problem, report it privately (see
        SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands, config, and what happened, with secrets redacted.
      render: shell
  - type: input
    id: context
    attributes:
      label: Context
      description: Host or agent, OS, and how it is running (culprit.sh, systemd, or Docker).
      placeholder: e.g. Ubuntu 24.04 host as a systemd user service, three Docker agents
