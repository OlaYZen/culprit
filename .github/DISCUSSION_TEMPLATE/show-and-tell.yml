title: "[Setup]: "
body:
  - type: markdown
    attributes:
      value: |
        Show off your Culprit setup: a dashboard screenshot, the kind of fleet
        you watch, or a slowdown it helped you catch. You can drag and drop
        images straight into the text boxes.
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: What you run Culprit on, and how you use it.
    validations:
      required: true
  - type: input
    id: scale
    attributes:
      label: Fleet size
      description: How many nodes, and what kinds of machines.
      placeholder: e.g. one host plus six agents (bare metal, VMs, and a couple of Docker hosts)
  - type: textarea
    id: highlight
    attributes:
      label: A highlight (optional)
      description: A culprit it caught, a tweak you made, or a screenshot worth sharing.
