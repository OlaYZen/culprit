name: Incorrect or missing metric
description: A number looks wrong, or a source reads "unavailable" when you think it should work.
title: "[Data]: "
labels: ["data-accuracy", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Culprit's core promise is that it never lies: a missing source says why,
        and a number should match ground truth. If it does not, tell us here.
        Please compare against a standard tool so we can see the gap.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I checked the source-availability matrix (`./culprit.sh --install-only`) or the smoketest.
          required: true
  - type: dropdown
    id: view
    attributes:
      label: Which view or metric?
      options:
        - Processor / CPU
        - Memory
        - Pressure (PSI)
        - GPU / Graphics
        - Disk
        - Network / Ports
        - Processes / Lag Doctor
        - Services (systemd units)
        - Events
        - Sessions
        - Sync
        - Trends
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: What it shows vs. ground truth
      description: |
        What Culprit reports, and what you believe is correct, with the output
        of a standard tool for comparison (for example `top`, `iostat -x`,
        `free -m`, `systemctl status`, `ss -tulpn`, `cat /proc/pressure/*`).
      placeholder: |
        Culprit shows disk %util at 0 for nvme0n1, but `iostat -x 1` shows ...
    validations:
      required: true
  - type: textarea
    id: matrix
    attributes:
      label: Source-availability matrix or smoketest output
      description: Paste the matrix from `./culprit.sh --install-only`, or the relevant rows from `python tools/smoketest.py`.
      render: shell
  - type: input
    id: os
    attributes:
      label: OS and kernel
      placeholder: e.g. Ubuntu 24.04, kernel 6.8
    validations:
      required: true
  - type: checkboxes
    id: environment
    attributes:
      label: Environment
      options:
        - label: This machine is a container or VM (not bare metal)
        - label: The kernel has PSI (`/proc/pressure` exists)
        - label: The process is running as root or with extra capabilities
