name: Question / help
description: Ask how to do something, or get help with a setup.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Happy to help. Please check the README and SECURITY policy first; a lot
        of setup and hardening questions are answered there.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you ask
      options:
        - label: I read the relevant part of the README.
          required: true
        - label: I searched existing issues.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do and where you are stuck.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands you ran and what happened, with secrets redacted.
      render: shell
  - type: input
    id: context
    attributes:
      label: Context
      description: OS, whether this is the host or an agent, and how it is running.
      placeholder: e.g. Ubuntu 24.04 host, systemd user service; two Docker agents
