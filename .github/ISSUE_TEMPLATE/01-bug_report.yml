name: Bug report
description: Something is broken, crashes, or behaves incorrectly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more you can fill in, the
        faster we can reproduce and fix it.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I reproduced this on the latest `main`.
          required: true
        - label: This is not a security vulnerability (those go privately through the Security tab).
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the bug occur?
      options:
        - Host (dashboard / API / auth)
        - Agent (a monitored node)
        - Frontend (a specific view or chart)
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: A clear description of the actual behaviour and the expected behaviour.
      placeholder: When I open the Ports view, every row shows "another user's process", but the agent runs as root.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger it.
      placeholder: |
        1. Enroll an agent with `agents add web-01`
        2. Deploy it with `./agent.sh ...`
        3. Open the Ports view
        4. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, or the image tag for a Docker agent.
      placeholder: e.g. a7497b0, or ghcr.io/olayzen/culprit-agent:latest
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and kernel of the affected machine
      description: From `uname -a` and `/etc/os-release`.
      placeholder: e.g. Ubuntu 24.04.1, kernel 6.8.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it running?
      options:
        - culprit.sh (foreground, --run)
        - systemd user service
        - Docker (agent)
        - python -m culprit directly
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant logs, with secrets redacted. Host service:
        `journalctl --user -u culprit -n 100`. Docker agent: `docker logs culprit-agent`.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, configuration, or other context that might help.
