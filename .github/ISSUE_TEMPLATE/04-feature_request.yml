name: Feature request
description: Suggest a new capability or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Culprit aims to stay lightweight and honest, so the
        best proposals fit that spirit: they name a real problem, degrade
        gracefully when a source is missing, and never show a made-up number.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and did not find a duplicate request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation you are in and what makes it painful today. Focus on the need, not the solution.
      placeholder: When a box is slow I still have to SSH in to check ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like Culprit to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new or improved collector / metric
        - Lag Doctor scoring
        - Frontend / a view
        - Multi-node / fleet
        - Agent / deployment
        - Security / auth
        - Other
    validations:
      required: true
  - type: checkboxes
    id: philosophy
    attributes:
      label: Fit
      options:
        - label: This keeps the agent dependency-light (psutil + stdlib, no open ports).
        - label: It degrades honestly when the underlying source is unavailable.
